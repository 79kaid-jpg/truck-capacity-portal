<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- v3.58: sơ đồ quy trình đơn tự chạy, nhúng vào Hướng dẫn › Vòng đời một đơn (iframe). Nội dung theo mã: send_to_logistics, save_booking, confirm_delivery, mark_loaded, driver_mark. -->
<title>Quy trình đơn đặt xe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
</head>
<body>
<style>
/* Layout: sơ đồ chia làn ở trên, bảng giải thích bước hiện tại ở dưới; dùng token màu của Portal Đặt Xe */
:root{
  --ground:#E6E9EC; --surface:#FFFFFF; --sand:#F0EBE0;
  --ink:#17202B; --muted:#5B6674; --line:#D3D9DF;
  --primary:#1F2C3D; --on-primary:#FFFFFF;
  --ok:#1B6B40; --ok-bg:#E2F2E8; --warn:#8A5A00; --warn-bg:#FBEFD3; --bad:#A8322A; --bad-bg:#F8E1DF;
  --blue:#2459C4; --blue-bg:#DCE7FB; --pend:#9A4A0B; --pend-bg:#FCEBDD;
  --req:#7A4BD1; --req-bg:#F1EAFF; --mask:#A8B0BA;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0E131A; --surface:#161E28; --sand:#1E2731; --ink:#E5E9EE; --muted:#9AA6B4; --line:#2B3745;
  --primary:#7FA2D6; --on-primary:#0B1220;
  --ok:#5BC48A; --ok-bg:#16301F; --warn:#E3B34F; --warn-bg:#33280F; --bad:#EF7A70; --bad-bg:#3A1A18;
  --blue:#7EA6F2; --blue-bg:#16264A; --pend:#F0A066; --pend-bg:#3A2412; --req:#9B97D1; --req-bg:#241D38; --mask:#4D5866;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0E131A; --surface:#161E28; --sand:#1E2731; --ink:#E5E9EE; --muted:#9AA6B4; --line:#2B3745;
  --primary:#7FA2D6; --on-primary:#0B1220;
  --ok:#5BC48A; --ok-bg:#16301F; --warn:#E3B34F; --warn-bg:#33280F; --bad:#EF7A70; --bad-bg:#3A1A18;
  --blue:#7EA6F2; --blue-bg:#16264A; --pend:#F0A066; --pend-bg:#3A2412; --req:#9B97D1; --req-bg:#241D38; --mask:#4D5866;
  color-scheme:dark}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;margin:2px 0 0}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:inherit;font-size:.85rem;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;cursor:pointer}
.ib{display:inline-grid;place-items:center;min-width:40px;padding:0}
button.main{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:600;min-width:48px}
button:focus-visible,select:focus-visible,.node:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap>*{min-width:0}
.board{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
#svg{display:block;min-width:900px;width:100%;height:auto}
.lane-bg{fill:var(--surface)} .lane-alt{fill:var(--sand)}
.lane-t{fill:var(--muted);font:600 12px var(--f-body);letter-spacing:.04em;text-transform:uppercase}
.node rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5;transition:all .4s}
.node text{fill:var(--ink);font:600 13px var(--f-body)}
.node .st{fill:var(--muted);font:500 12px var(--f-body)}
.node{cursor:pointer;transition:opacity .4s}
.node.done rect{stroke:var(--mask)}
.node.on rect{stroke:var(--blue);stroke-width:3;fill:var(--blue-bg)}
.dim .node:not(.on):not(.done){opacity:.45}
.edge{fill:none;stroke:var(--mask);stroke-width:1.5;transition:stroke .4s}
.edge.err{stroke-dasharray:5 4}
.edge.on{stroke:var(--blue);stroke-width:2.5;stroke-dasharray:8 6;animation:flow 1s linear infinite}
.elab{fill:var(--muted);font:500 12px var(--f-body)}
#ah path{fill:var(--mask)}
@keyframes flow{to{stroke-dashoffset:-28}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:grid;gap:12px}
.ph{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ph h2{font-family:var(--f-display);font-size:1.25rem;margin:0 8px 0 0}
.no{font:600 .8rem var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.who{background:var(--req-bg);color:var(--req)}
.st-draft{color:var(--muted);background:var(--sand)} .st-hold,.st-dconfh{color:var(--pend);background:var(--pend-bg)} .st-ok,.st-dconf,.st-delivered{color:var(--ok);background:var(--ok-bg)}
.st-loaded,.st-transit,.st-resched{color:var(--blue);background:var(--blue-bg)} .st-cancelled,.st-failed,.st-rejected{color:var(--bad);background:var(--bad-bg)} .st-req{color:var(--req);background:var(--req-bg)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.cols>div{min-width:0}
.cols h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.cols ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.9rem;max-width:65ch}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots button{min-height:32px;min-width:32px;padding:0;font-size:12px;font-variant-numeric:tabular-nums}
.dots button[aria-current="step"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.foot{color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion: reduce){.edge.on{animation:none}.bar i{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Quy trình đơn đặt xe</h1>
      <p class="sub">Mỗi bước: ai làm, điều kiện, kết quả.</p>
    </div>
    <div class="ctrl">
      <button id="prev" class="ib" aria-label="Bước trước" title="Bước trước"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button id="play" class="main ib" aria-label="Phát" title="Phát"></button>
      <button id="next" class="ib" aria-label="Bước sau" title="Bước sau"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <select id="speed" aria-label="Tốc độ" title="Tốc độ"><option value="14000">Rất chậm</option><option value="10000" selected>Chậm</option><option value="7000">Vừa</option></select>
    </div>
  </header>

  <div class="board" id="board"><svg id="svg" viewBox="0 0 1100 520" role="img" aria-label="Sơ đồ quy trình đơn đặt xe theo vai trò"></svg></div>

  <section class="panel" aria-live="polite">
    <div class="bar"><i id="bar"></i></div>
    <div class="ph"><span class="no" id="no"></span><h2 id="t"></h2><span class="chip who" id="who"></span><span class="chip" id="st"></span></div>
    <div class="cols">
      <div><h3>Hành động</h3><ul id="act"></ul></div>
      <div><h3>Điều kiện</h3><ul id="cond"></ul></div>
      <div><h3>Kết quả</h3><ul id="res"></ul></div>
    </div>
    <div class="dots" id="dots"></div>
  </section>
  <p class="foot">Bấm vào một ô trên sơ đồ hoặc số bước để nhảy tới. Đơn đã Đã bốc / Đang giao thì không hủy được; CS hủy đơn sau giờ chốt sẽ gắn cờ "Hủy quá cận ngày".</p>
</div>

<script>
const LANES=["Khách / Sales","CS","Logistics","Tài xế","Hệ thống"];
const X0=130,CW=162,LH=104,TOP=0,BW=136,BH=58;
const N={
 req:{l:0,c:0,t:"Yêu cầu đặt hàng",s:""},
 draft:{l:1,c:1,t:"Tạo đơn",s:"Nháp"},
 purge:{l:4,c:1,t:"Tự hủy nháp",s:"Đã hủy"},
 review:{l:2,c:2,t:"Gửi Logistics",s:"Chờ xếp xe"},
 cap:{l:4,c:2,t:"Giữ sức chứa",s:"theo ngày bốc"},
 decide:{l:2,c:3,t:"Xét đơn",s:"xếp / đổi / từ chối"},
 rebook:{l:1,c:3,t:"Sửa / đặt lại",s:"về Chờ xếp xe"},
 assign:{l:2,c:4,t:"Xếp xe",s:"Đã xếp xe"},
 confirm:{l:1,c:4,t:"Xác nhận giao",s:"cuộn + địa chỉ"},
 load:{l:2,c:5,t:"Load hàng",s:"Đã bốc"},
 short:{l:1,c:5,t:"Load thiếu",s:"tách / không giao"},
 drive:{l:3,c:5,t:"Giao hàng",s:"Đang giao → Đã giao"}
};
const E=[
 ["req","draft","CS tạo đơn"],["draft","review","Gửi"],["draft","purge","",1],["review","cap","",1],
 ["review","decide",""],["decide","assign",""],["decide","rebook","đổi ngày / từ chối",1],
 ["assign","confirm","nhập cuộn"],["confirm","load",""],["load","short","thiếu cuộn",1],
 ["load","drive","link tài xế"],["drive","rebook","giao lỗi",1]
];
const STEPS=[
 {n:"req",who:"Khách, Sales, CS",k:"req",st:"Yêu cầu: Mới",
  a:["Khách gửi yêu cầu: kho, ngày giao, số tấn, ghi chú (ví dụ \"20 MT HC 0.5 xanh dương\")","Sales hoặc CS có thể gửi thay khách"],
  c:["Khách chỉ gửi cho chính mình","Sales / CS cần quyền Gửi yêu cầu đặt hàng và chỉ chọn khách trong phạm vi của mình","Ngày giao từ hôm nay trở đi, kho đang dùng"],
  r:["Hệ thống tính ngày bốc dự kiến = ngày giao − số ngày đi theo Zone","Yêu cầu hiện trên lịch để CS xử lý"]},
 {n:"draft",who:"CS",k:"draft",st:"Nháp",
  a:["CS tạo booking từ yêu cầu (hoặc trực tiếp bằng nút Đặt hàng)","Bấm Lưu tạm để giữ đơn ở dạng Nháp","Đánh dấu yêu cầu Đã tạo đơn, hoặc Không nhận kèm lý do"],
  c:["Quyền Tạo booking (CS, Admin)","Nháp chưa trừ sức chứa của ngày bốc"],
  r:["Đơn có mã, hiện trên lịch của người tạo","Người gửi yêu cầu được báo lại"]},
 {n:"purge",who:"Hệ thống",k:"cancelled",st:"Nháp → Đã hủy",
  a:["Hệ thống quét nháp tự động"],
  c:["Nháp quá ngày bốc 2 ngày mà chưa gửi Logistics"],
  r:["Đơn chuyển Đã hủy, ghi lý do \"Nháp quá ngày bốc 2 ngày, hệ thống tự hủy\""]},
 {n:"review",who:"CS",k:"hold",st:"Nháp → Chờ xếp xe",
  a:["CS bấm Gửi Logistics (gửi được nhiều đơn cùng lúc)"],
  c:["Ngày bốc chưa qua","Kho đang dùng và ngày đó đã khai báo xe","Số tấn lớn hơn 0","Không vượt sức chứa còn lại của ngày bốc"],
  r:["Đơn sang Chờ xếp xe, lưu ngày bốc gốc","Logistics của kho và Sales phụ trách nhận thông báo","Cờ đơn khẩn được tính lại"]},
 {n:"cap",who:"Hệ thống",k:"hold",st:"Chờ xếp xe",
  a:["Khóa ngày bốc trong lúc kiểm tra để hai người không đặt chồng"],
  c:["Sức chứa tính theo ngày bốc của kho, không theo ngày giao"],
  r:["Số tấn của đơn được trừ vào năng lực ngày đó","Quá giờ chốt mà chưa xử lý thì nhắc CS"]},
 {n:"decide",who:"Logistics",k:"hold",st:"Chờ xếp xe",
  a:["Mở đơn ở Approval request hoặc Chi tiết ngày","Chọn một trong ba: xếp xe, đề nghị đổi ngày, từ chối"],
  c:["Quyền Gán xe (xếp xe) và Từ chối / đề nghị đổi ngày","Đổi ngày và từ chối bắt buộc chọn lý do"],
  r:["Xếp xe → Đã xếp xe","Đề nghị đổi ngày → Đề nghị đổi ngày","Từ chối → Từ chối"]},
 {n:"rebook",who:"CS",k:"hold",st:"→ Chờ xếp xe",
  a:["CS sửa và lưu lại đơn đang Đề nghị đổi ngày, Từ chối hoặc Giao không thành công","CS sửa đơn Đã xếp xe (đổi ngày, số tấn, địa chỉ)"],
  c:["Quyền Sửa booking","Đổi ngày bốc phải chọn lý do và bên yêu cầu: Khách / CS / Logistics"],
  r:["Đơn giữ nguyên mã, quay về Chờ xếp xe","Xe đã gán bị gỡ, Logistics xếp lại"]},
 {n:"assign",who:"Logistics",k:"ok",st:"Chờ xếp xe → Đã xếp xe",
  a:["Dùng Gợi ý xếp xe hoặc xếp tay đơn lên xe","Có thể gộp đơn, chuyển hoặc gỡ phần hàng"],
  c:["Phải xếp đủ số tấn của đơn","Xếp lại mà thiếu tấn thì đơn tự về Chờ xếp xe"],
  r:["Đơn sang Đã xếp xe","CS và Sales nhận thông báo"]},
 {n:"confirm",who:"CS",k:"dconf",st:"Đã xác nhận giao hàng",
  a:["CS Xác nhận giao hàng: nhập địa chỉ giao và danh sách cuộn","Có thể làm trước khi xếp xe (đơn khẩn): đơn hiện \"Đã XN giao hàng · Chờ xếp xe\", Logistics được báo xếp xe ngay"],
  c:["Quyền Xác nhận giao hàng","Tổng cuộn thiếu so với số tấn: chọn Tách đơn hoặc Không giao phần còn lại","Tổng cuộn nhiều hơn: tick Cập nhật số tấn, phải còn sức chứa"],
  r:["Đơn có danh sách cuộn, được phép load","Tăng tấn mà xe chưa đủ chỗ → về Chờ xếp xe","Xác nhận sau ngày bốc → đổi ngày, gỡ xe cũ, về Chờ xếp xe"]},
 {n:"load",who:"Logistics",k:"loaded",st:"Đã xếp xe → Đã bốc",
  a:["Bấm Load hàng, đánh dấu cuộn nào không lên xe","Có thể Mở lại load nếu bấm nhầm"],
  c:["Đơn phải Đã xếp xe","Đơn phải có danh sách cuộn (CS đã Xác nhận giao hàng)","Cuộn không lên xe bắt buộc ghi chú"],
  r:["Đơn sang Đã bốc, không hủy được nữa","Mở lại load → về Đã xếp xe"]},
 {n:"short",who:"CS",k:"loaded",st:"Đã bốc (load thiếu)",
  a:["CS xử lý phần tấn không lên xe: Tách đơn sang ngày khác hoặc Không giao phần còn lại"],
  c:["Chỉ áp dụng khi có cuộn không lên xe","Đơn đang Đã bốc, Đang giao hoặc Đã giao"],
  r:["Số tấn đơn gốc giảm theo phần đã load","Tách đơn tạo đơn con chờ xếp xe ngày mới"]},
 {n:"drive",who:"Tài xế (Logistics làm thay được)",k:"delivered",st:"Đã bốc → Đang giao → Đã giao",
  a:["Logistics tạo link cho từng xe và gửi tài xế","Tài xế mở link, bấm Bắt đầu chạy","Giao xong: xác nhận Đã giao kèm ảnh; không giao được: báo Giao không thành công"],
  c:["Link còn hiệu lực, không cần đăng nhập","Chỉ xác nhận cho đơn Đã bốc hoặc Đang giao","Giao không thành công bắt buộc ghi lý do"],
  r:["Đã giao: đơn đóng, lưu ảnh xác nhận","Giao không thành công: CS sửa và đặt lại, đơn về Chờ xếp xe"]}
];
const svg=document.getElementById("svg"),NS="http://www.w3.org/2000/svg";
const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e};
const cx=c=>X0+c*CW+CW/2, cy=l=>TOP+l*LH+LH/2;
const defs=mk("defs",{});const m=mk("marker",{id:"ah",viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"},defs);mk("path",{d:"M0 0L10 5L0 10z"},m);
LANES.forEach((n,i)=>{mk("rect",{x:0,y:i*LH,width:1100,height:LH,class:i%2?"lane-alt":"lane-bg"});const t=mk("text",{x:14,y:i*LH+LH/2+4,class:"lane-t"});t.textContent=n;});
mk("line",{x1:X0-6,y1:0,x2:X0-6,y2:LANES.length*LH,stroke:"var(--line)"});
const edges={};
E.forEach(([a,b,lab,err])=>{
  const A=N[a],B=N[b];let x1=cx(A.c),y1=cy(A.l),x2=cx(B.c),y2=cy(B.l),d,lx,ly;
  if(A.l===B.l){x1+=(x2>x1?1:-1)*BW/2;x2-=(x2>x1?1:-1)*BW/2;d=`M${x1} ${y1}H${x2}`;lx=(x1+x2)/2;ly=y1-8;}
  else if(A.c===B.c){y1+=(y2>y1?1:-1)*BH/2;y2-=(y2>y1?1:-1)*BH/2;d=`M${x1} ${y1}V${y2}`;lx=x1+6;ly=(y1+y2)/2;}
  else{const dn=y2>y1;const sx=x1+(x2>x1?1:-1)*BW/2;const ey=y2+(dn?-1:1)*BH/2;
    if(b==="rebook"&&a==="drive"){const xm=cx(2)+CW/2,yb=cy(1)+BH/2+16;d=`M${x1-BW/2} ${y1}H${xm}V${yb}H${x2-30}V${cy(1)+BH/2}`;lx=(x1-BW/2+xm)/2;ly=y1-8;}
    else if(a==="confirm"&&b==="load"){const xm=cx(4)+CW/2;d=`M${x1+BW/2} ${y1}H${xm}V${y2}H${x2-BW/2}`;lx=xm;ly=(y1+y2)/2+4;}
    else{const sy=y1+(dn?1:-1)*BH/2,ex=x2+(x2>x1?-1:1)*BW/2;d=`M${x1} ${sy}V${y2}H${ex}`;lx=(x1+ex)/2;ly=y2-8;}}
  const p=mk("path",{d,class:"edge"+(err?" err":""),"marker-end":"url(#ah)"});edges[a+">"+b]=p;
  if(lab){const t=mk("text",{x:lx,y:ly,class:"elab","text-anchor":A.c===B.c?"start":"middle"});t.textContent=lab;}
});
const nodes={};
Object.entries(N).forEach(([id,n])=>{
  const g=mk("g",{class:"node",tabindex:"0",role:"button","aria-label":n.t});
  mk("rect",{x:cx(n.c)-BW/2,y:cy(n.l)-BH/2,width:BW,height:BH,rx:8},g);
  const t=mk("text",{x:cx(n.c),y:cy(n.l)-3,"text-anchor":"middle"},g);t.textContent=n.t;
  const s=mk("text",{x:cx(n.c),y:cy(n.l)+15,"text-anchor":"middle",class:"st"},g);s.textContent=n.s;
  const go=()=>{const i=STEPS.findIndex(x=>x.n===id);if(i>=0){stop();show(i);}};
  g.addEventListener("click",go);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});
  nodes[id]=g;
});
const $=id=>document.getElementById(id);
const dots=$("dots");
STEPS.forEach((s,i)=>{const b=document.createElement("button");b.textContent=i+1;b.setAttribute("aria-label","Bước "+(i+1)+": "+N[s.n].t);b.onclick=()=>{stop();show(i)};dots.appendChild(b);});
let cur=0,timer=null,t0=0,raf=0;
function setPlay(on){const b=$("play");b.innerHTML=on?"<svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 5v14M16 5v14\"/></svg>":"<svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 5l12 7-12 7z\" fill=\"currentColor\"/></svg>";b.setAttribute("aria-label",on?"Tạm dừng":"Phát");b.title=on?"Tạm dừng":"Phát";}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function fill(id,arr){const u=$(id);u.innerHTML="";arr.forEach(x=>{const li=document.createElement("li");li.textContent=x;u.appendChild(li);});}
function show(i){
  cur=(i+STEPS.length)%STEPS.length;const s=STEPS[cur];
  svg.classList.add("dim");
  Object.values(nodes).forEach(g=>g.classList.remove("on","done"));
  STEPS.slice(0,cur).forEach(x=>nodes[x.n].classList.add("done"));
  nodes[s.n].classList.add("on");
  Object.entries(edges).forEach(([k,p])=>p.classList.toggle("on",k.endsWith(">"+s.n)&&STEPS.slice(0,cur).some(x=>k.startsWith(x.n+">"))));
  $("no").textContent=(cur+1)+" / "+STEPS.length;$("t").textContent=N[s.n].t;$("who").textContent=s.who;$("st").textContent=s.st;$("st").className="chip st-"+s.k;
  fill("act",s.a);fill("cond",s.c);fill("res",s.r);
  [...dots.children].forEach((b,j)=>b.setAttribute("aria-current",j===cur?"step":"false"));
  const bd=$("board"),nx=cx(N[s.n].c);if(bd.scrollWidth>bd.clientWidth){bd.scrollTo({left:nx*bd.scrollWidth/1100-bd.clientWidth/2,behavior:reduce?"auto":"smooth"});}
  t0=performance.now();$("bar").style.width="0";
}
function tick(now){const d=+$("speed").value;const f=Math.min(1,(now-t0)/d);$("bar").style.width=(f*100)+"%";if(f>=1){if(cur===STEPS.length-1){stop();return;}show(cur+1);}raf=requestAnimationFrame(tick);}
function start(){if(cur===STEPS.length-1)show(0);t0=performance.now();timer=1;setPlay(1);raf=requestAnimationFrame(tick);}
function stop(){timer=null;cancelAnimationFrame(raf);setPlay(0);$("bar").style.width="0";}
$("play").onclick=()=>timer?stop():start();
$("prev").onclick=()=>{stop();show(cur-1)};$("next").onclick=()=>{stop();show(cur+1)};
document.addEventListener("keydown",e=>{if(e.target.closest("select"))return;if(e.key==="ArrowRight"){stop();show(cur+1)}if(e.key==="ArrowLeft"){stop();show(cur-1)}});
setPlay(0);show(0);
</script>
</body>
</html>
